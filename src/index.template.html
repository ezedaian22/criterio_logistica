  <script type="text/javascript">
    // Registro del service worker: fuera del bloque de Babel a propósito, para
    // que se registre aunque la compilación del JSX falle.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (e) {
          console.warn("[Criterio] service worker no registrado:", e);
        });
      });
    }
  </script>
